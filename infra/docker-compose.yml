services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: causor
      POSTGRES_PASSWORD: causor
      POSTGRES_DB: causor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
