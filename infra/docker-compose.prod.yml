name: causor

# Docker keeps container logs forever by default; cap each service at 30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    container_name: causor-backend
    image: ghcr.io/arthurmoreiras/causor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - causor_artifacts:/app/artifacts
    networks: [causor, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    container_name: causor-worker
    image: ghcr.io/arthurmoreiras/causor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    command: python -m app.cli worker
    volumes:
      - causor_artifacts:/app/artifacts
    networks: [causor]

  autos-worker:
    image: ghcr.io/arthurmoreiras/causor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    command: python -m app.autos.worker
    volumes:
      - causor_artifacts:/app/artifacts
    networks: [causor]

  capture-scheduler:
    image: ghcr.io/arthurmoreiras/causor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    command: python -m app.capture.service
    networks: [causor]
    healthcheck:
      test: ["CMD", "python", "-m", "app.capture.service", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    container_name: causor-frontend
    image: ghcr.io/arthurmoreiras/causor-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [causor, edge]

  # One-shot: roda no deploy via `docker compose run --rm migrate`.
  # profile "tools" evita que suba junto com `up -d`.
  migrate:
    image: ghcr.io/arthurmoreiras/causor-backend:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: python -m alembic upgrade head
    restart: "no"
    profiles: ["tools"]
    networks: [causor]

networks:
  causor: {}
  edge:
    external: true

volumes:
  causor_artifacts: {}
